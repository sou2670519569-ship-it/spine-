<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spine Viewer</title>

  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.*/dist/iife/spine-player.js"></script>
  <link
    rel="stylesheet"
    href="https://unpkg.com/@esotericsoftware/spine-player@4.2.*/dist/spine-player.css"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      background: #111;
      color: white;
      font-family: Arial;
    }

    #sidebar {
      width: 280px;
      background: #1a1a1a;
      overflow-y: auto;
      border-right: 1px solid #333;
    }

    #title {
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    .item {
      padding: 14px 18px;
      cursor: pointer;
      border-bottom: 1px solid #2a2a2a;
    }

    .item:hover {
      background: #2a2a2a;
    }

    #viewer {
      flex: 1;
      position: relative;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    .loading {
      padding: 20px;
      color: #999;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="title">Spine Assets</div>
    <div id="list" class="loading">Loading...</div>
  </div>

  <div id="viewer">
    <div id="player"></div>
  </div>

  <script>
    // 修改成你的 GitHub 用户名
    const OWNER = 'sou2670519569-ship-it'

    // 修改成你的仓库名
    const REPO = 'spine-'

    // 分支
    const BRANCH = 'main'

    const API = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`

    const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`

    let currentPlayer = null

    async function scanSpine() {
      const res = await fetch(API)
      const data = await res.json()

      const files = data.tree || []

      const folders = {}

      for (const file of files) {
        const path = file.path

        if (!path.includes('/')) continue

        const parts = path.split('/')

        const folder = parts.slice(0, -1).join('/')

        const filename = parts[parts.length - 1]

        if (!folders[folder]) {
          folders[folder] = []
        }

        folders[folder].push(filename)
      }

      const assets = []

      for (const folder in folders) {
        const list = folders[folder]

        const atlas = list.find(v => v.endsWith('.atlas'))
        const json = list.find(v => v.endsWith('.json'))
        const skel = list.find(v => v.endsWith('.skel'))

        if (!atlas) continue
        if (!json && !skel) continue

        const spineFile = json || skel

        assets.push({
          name: folder.split('/').pop(),
          folder,
          spine: `${RAW}/${folder}/${spineFile}`,
          atlas: `${RAW}/${folder}/${atlas}`
        })
      }

      return assets
    }

    function renderList(assets) {
      const list = document.getElementById('list')

      if (assets.length === 0) {
        list.innerHTML = 'No Spine Found'
        return
      }

      list.innerHTML = ''

      assets.forEach(asset => {
        const div = document.createElement('div')

        div.className = 'item'
        div.innerText = asset.name

        div.onclick = () => {
          playSpine(asset)
        }

        list.appendChild(div)
      })

      playSpine(assets[0])
    }

    function playSpine(asset) {
      const container = document.getElementById('player')

      container.innerHTML = ''

      currentPlayer = new spine.SpinePlayer('player', {
        jsonUrl: asset.spine.endsWith('.json') ? asset.spine : undefined,
        skelUrl: asset.spine.endsWith('.skel') ? asset.spine : undefined,
        atlasUrl: asset.atlas,
        alpha: true,
        backgroundColor: '#111111',
        showControls: true,
        premultipliedAlpha: true,
        preserveDrawingBuffer: true,
        success: function(player) {
          const animations = player.skeleton.data.animations

          if (animations.length > 0) {
            player.animationState.setAnimation(0, animations[0].name, true)
          }
        }
      })
    }

    async function init() {
      const assets = await scanSpine()
      renderList(assets)
    }

    init()
  </script>
</body>
</html>
