<!DOCTYPE html>
<html lang="zh">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Universal Spine Viewer</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#1e1e1e;
    color:white;
    font-family:sans-serif;
}

*{
    box-sizing:border-box;
}

#app{
    display:flex;
    width:100%;
    height:100%;
}

#sidebar{
    width:360px;
    background:#2b2b2b;
    border-right:1px solid #444;
    display:flex;
    flex-direction:column;
}

#search{
    height:50px;
    border:none;
    outline:none;
    background:#1f1f1f;
    color:white;
    padding:0 15px;
    font-size:14px;
}

#list{
    flex:1;
    overflow:auto;
}

.item{
    padding:12px;
    border-bottom:1px solid #3a3a3a;
    cursor:pointer;
    transition:.15s;
    user-select:none;
    word-break:break-all;
}

.item:hover{
    background:#444;
}

.item.active{
    background:#666;
}

#main{
    flex:1;
    position:relative;
}

#player{
    width:100%;
    height:100%;
}

#toolbar{
    position:absolute;
    top:10px;
    left:10px;
    z-index:999;
    background:rgba(0,0,0,.6);
    border-radius:10px;
    padding:10px;
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
}

#status{
    position:absolute;
    top:10px;
    right:10px;
    z-index:999;
    background:rgba(0,0,0,.6);
    padding:10px;
    border-radius:10px;
    font-size:12px;
    max-width:420px;
    word-break:break-all;
}

select,button{
    height:34px;
    border:none;
    border-radius:6px;
    padding:0 12px;
}

button{
    cursor:pointer;
}

</style>

</head>

<body>

<div id="app">

    <div id="sidebar">

        <input
            id="search"
            placeholder="搜索..."
        >

        <div id="list"></div>

    </div>

    <div id="main">

        <div id="toolbar">

            <span>动画</span>

            <select id="animSelect"></select>

            <button onclick="playAnimation()">
                播放
            </button>

        </div>

        <div id="status">
            初始化中...
        </div>

        <div id="player"></div>

    </div>

</div>

<script>

/****************************************
 * 配置
 ****************************************/

const USER = "sou2670519569-ship-it";

const REPO = "spine-";

const BRANCH = "main";

const RAW =
`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}`;

const MANIFEST =
`${RAW}/manifest.json`;

/****************************************
 * runtimes
 ****************************************/

const RUNTIMES = {

    "3.8":
    "https://unpkg.com/@esotericsoftware/spine-player@3.8.99/dist/iife/spine-player.js",

    "4.0":
    "https://unpkg.com/@esotericsoftware/spine-player@4.0.64/dist/iife/spine-player.js",

    "4.1":
    "https://unpkg.com/@esotericsoftware/spine-player@4.1.24/dist/iife/spine-player.js",

    "4.2":
    "https://unpkg.com/@esotericsoftware/spine-player@4.2.36/dist/iife/spine-player.js"
};

/****************************************/

const runtimeCache = {};

let currentPlayer = null;

let currentRuntime = null;

let allCharacters = [];

/****************************************/

const listEl =
document.getElementById("list");

const statusEl =
document.getElementById("status");

const searchInput =
document.getElementById("search");

const animSelect =
document.getElementById("animSelect");

/****************************************
 * 状态
 ****************************************/

function setStatus(text){

    statusEl.innerText = text;

    console.log(text);
}

/****************************************
 * 搜索
 ****************************************/

searchInput.oninput = ()=>{

    renderList(searchInput.value);
};

/****************************************
 * 初始化
 ****************************************/

init();

async function init(){

    try{

        setStatus("读取 manifest...");

        const res =
        await fetch(MANIFEST);

        allCharacters =
        await res.json();

        renderList();

        setStatus(
            `加载完成 ${allCharacters.length} 个角色`
        );

    }catch(err){

        console.error(err);

        setStatus(
            "manifest读取失败"
        );
    }
}

/****************************************
 * 获取目录层级
 ****************************************/

function getFolderLevels(path){

    const parts =
    path.split("/");

    return {

        level1:
        parts[0] || "Root",

        level2:
        parts[1] || "Default"
    };
}

/****************************************
 * 渲染
 ****************************************/

function renderList(keyword=""){

    listEl.innerHTML = "";

    const lower =
    keyword.toLowerCase();

    /************************************
     * 搜索模式
     ************************************/

    if(keyword.trim()){

        const filtered =
        allCharacters.filter(v=>{

            return (

                v.name
                .toLowerCase()
                .includes(lower)

                ||

                v.path
                .toLowerCase()
                .includes(lower)
            );
        });

        for(const item of filtered){

            createCharacterItem(item);
        }

        return;
    }

    /************************************
     * 一级分组
     ************************************/

    const groups = {};

    for(const item of allCharacters){

        const folders =
        getFolderLevels(item.path);

        const level1 =
        folders.level1;

        const level2 =
        folders.level2;

        if(!groups[level1]){

            groups[level1] = {};
        }

        if(!groups[level1][level2]){

            groups[level1][level2] = [];
        }

        groups[level1][level2].push(item);
    }

    const level1Names =
    Object.keys(groups)
    .sort();

    /************************************
     * 渲染一级
     ************************************/

    for(const level1 of level1Names){

        createLevel1Folder(
            level1,
            groups[level1]
        );
    }
}

/****************************************
 * 一级目录
 ****************************************/

function createLevel1Folder(name,subFolders){

    const div =
    document.createElement("div");

    div.className = "item";

    div.style.fontWeight = "bold";

    const total =
    Object.values(subFolders)
    .flat()
    .length;

    div.innerText =
    `📁 ${name} (${total})`;

    const container =
    document.createElement("div");

    container.style.display = "none";

    div.onclick = ()=>{

        container.style.display =

        container.style.display === "none"

        ? "block"

        : "none";
    };

    listEl.appendChild(div);

    const level2Names =
    Object.keys(subFolders)
    .sort();

    for(const level2 of level2Names){

        createLevel2Folder(
            container,
            level2,
            subFolders[level2]
        );
    }

    listEl.appendChild(container);
}

/****************************************
 * 二级目录
 ****************************************/

function createLevel2Folder(parent,name,items){

    const div =
    document.createElement("div");

    div.className = "item";

    div.style.paddingLeft = "24px";

    div.style.fontWeight = "bold";

    div.innerText =
    `📂 ${name} (${items.length})`;

    const container =
    document.createElement("div");

    container.style.display = "none";

    div.onclick = ()=>{

        event.stopPropagation();

        container.style.display =

        container.style.display === "none"

        ? "block"

        : "none";
    };

    parent.appendChild(div);

    items.sort((a,b)=>{

        return a.name.localeCompare(b.name);
    });

    for(const item of items){

        createCharacterItem(
            item,
            container
        );
    }

    parent.appendChild(container);
}

/****************************************
 * 角色
 ****************************************/

function createCharacterItem(data,parent=null){

    const div =
    document.createElement("div");

    div.className = "item";

    div.style.paddingLeft = "48px";

    div.innerText =
    `[${data.version}] ${data.name}`;

    div.onclick = (event)=>{

        event.stopPropagation();

        document
        .querySelectorAll(".item")
        .forEach(v=>{

            v.classList.remove("active");
        });

        div.classList.add("active");

        loadCharacter(data);
    };

    if(parent){

        parent.appendChild(div);
    }

    else{

        listEl.appendChild(div);
    }
}

/****************************************
 * runtime版本
 ****************************************/

function getRuntime(version){

    if(version.startsWith("3."))
        return "3.8";

    if(version.startsWith("4.0"))
        return "4.0";

    if(version.startsWith("4.1"))
        return "4.1";

    return "4.2";
}

/****************************************
 * 加载runtime
 ****************************************/

async function loadRuntime(version){

    return new Promise((resolve,reject)=>{

        if(currentRuntime === version){

            resolve();
            return;
        }

        if(runtimeCache[version]){

            currentRuntime =
            version;

            window.spine =
            runtimeCache[version];

            resolve();

            return;
        }

        delete window.spine;

        const old =
        document.getElementById(
            "runtimeScript"
        );

        if(old){

            old.remove();
        }

        const script =
        document.createElement("script");

        script.id =
        "runtimeScript";

        script.src =
        RUNTIMES[version];

        script.onload = ()=>{

            runtimeCache[version] =
            window.spine;

            currentRuntime =
            version;

            resolve();
        };

        script.onerror = reject;

        document.body.appendChild(script);
    });
}

/****************************************
 * 加载角色
 ****************************************/

async function loadCharacter(data){

    try{

        const runtime =
        getRuntime(data.version);

        setStatus(
            `Spine ${data.version}
            
Runtime ${runtime}`
        );

        await loadRuntime(runtime);

        if(currentPlayer){

            try{
                currentPlayer.dispose();
            }catch(e){}
        }

        document
        .getElementById("player")
        .innerHTML = "";

        const encodedPath =
        data.path
        .split("/")
        .map(encodeURIComponent)
        .join("/");

        const base =
        `${RAW}/${encodedPath}`;

        const config = {

            alpha:true,

            backgroundColor:"#1e1e1e",

            premultipliedAlpha:false,

            success:(player)=>{

                currentPlayer = player;

                setupAnimations(player);

                setStatus(
                    `已加载
                    
${data.name}

Spine ${data.version}
Runtime ${runtime}`
                );
            },

            error:(err)=>{

                console.error(err);

                setStatus(
                    `加载失败
                    
${err}`
                );
            }
        };

        if(data.atlas){

            config.atlasUrl =
            `${base}/${encodeURIComponent(data.atlas)}`;
        }

        if(data.json){

            config.jsonUrl =
            `${base}/${encodeURIComponent(data.json)}`;
        }

        if(data.skel){

            config.skelUrl =
            `${base}/${encodeURIComponent(data.skel)}`;
        }

        new spine.SpinePlayer(
            "player",
            config
        );

    }catch(err){

        console.error(err);

        setStatus(
            `播放失败
            
${err}`
        );
    }
}

/****************************************
 * 动画
 ****************************************/

function setupAnimations(player){

    animSelect.innerHTML = "";

    const animations =
    player.skeleton.data.animations;

    for(const anim of animations){

        const option =
        document.createElement("option");

        option.value =
        anim.name;

        option.innerText =
        anim.name;

        animSelect.appendChild(option);
    }

    if(animations.length){

        player.setAnimation(
            animations[0].name,
            true
        );
    }
}

/****************************************
 * 播放
 ****************************************/

function playAnimation(){

    if(!currentPlayer)
        return;

    currentPlayer.setAnimation(
        animSelect.value,
        true
    );
}

</script>

</body>
</html>
