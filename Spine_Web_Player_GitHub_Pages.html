<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine Web Player - GitHub Pages 在线预览</title>
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .header p {
            color: #ccc;
            font-size: 14px;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .sidebar {
            width: 280px;
            background: #222;
            border-radius: 8px;
            padding: 16px;
            height: calc(100vh - 120px);
            overflow-y: auto;
        }
        .sidebar h3 {
            margin-bottom: 12px;
            font-size: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
        }
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .file-item {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }
        .file-item:hover {
            background: #333;
        }
        .file-item.active {
            background: #0071e3;
            color: #fff;
        }
        .folder {
            font-weight: 500;
            color: #6cf;
        }
        .spine-container {
            flex: 1;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        #player {
            width: 100%;
            height: calc(100vh - 120px);
        }
        .status {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 100;
        }
        .loading {
            color: #ff9;
        }
        .success {
            color: #6f6;
        }
        .error {
            color: #f66;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Spine Web Player - GitHub Pages 在线预览</h1>
        <p>支持 .skel / .json + .atlas + .png，自动扫描仓库所有子文件夹</p>
    </div>

    <div class="container">
        <div class="sidebar">
            <h3>骨骼文件列表</h3>
            <div id="fileList" class="file-list">加载中...</div>
        </div>
        <div class="spine-container">
            <div id="status" class="status">准备就绪</div>
            <div id="player"></div>
        </div>
    </div>

    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.min.js"></script>
    <script>
        // ========== 配置区 ==========
        const CONFIG = {
            rootPath: './',          // GitHub Pages 根目录
            spineVersion: '4.2',    // 与导出版本一致
            defaultBackgroundColor: '#1a1a1a',
            showControls: true,
            premultipliedAlpha: true
        };

        let currentPlayer = null;
        let fileMap = {}; // 存储 {name: {jsonPath, atlasPath, pngPath}}

        // ========== 1. 递归扫描文件 ==========
        async function scanFiles(path) {
            try {
                const response = await fetch(path, { method: 'GET' });
                if (!response.ok) return [];
                const text = await response.text();
                
                // 简单解析 GitHub Pages 目录列表
                const links = Array.from(text.matchAll(/href="([^"]+)"/g)).map(m => m[1]);
                const files = [];
                for (const link of links) {
                    if (link.startsWith('/')) continue;
                    const full = path + link;
                    if (link.endsWith('/')) {
                        files.push(...await scanFiles(full));
                    } else {
                        files.push(full);
                    }
                }
                return files;
            } catch (e) {
                console.error('扫描失败', e);
                return [];
            }
        }

        // ========== 2. 匹配骨骼资源组 ==========
        function buildSkeletonMap(files) {
            const map = {};
            const exts = ['.skel', '.json', '.atlas', '.png'];
            files.forEach(f => {
                const name = f.split('/').pop().split('.')[0];
                if (!map[name]) map[name] = {};
                if (f.endsWith('.skel')) map[name].skel = f;
                if (f.endsWith('.json')) map[name].json = f;
                if (f.endsWith('.atlas')) map[name].atlas = f;
                if (f.endsWith('.png')) map[name].png = f;
            });

            const result = {};
            Object.keys(map).forEach(key => {
                const item = map[key];
                if ((item.skel || item.json) && item.atlas && item.png) {
                    result[key] = item;
                }
            });
            return result;
        }

        // ========== 3. 渲染文件列表 ==========
        function renderList() {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            const keys = Object.keys(fileMap);
            if (keys.length === 0) {
                list.innerHTML = '<div style="color:#f66;">未找到可用的 Spine 资源</div>';
                return;
            }
            keys.forEach(key => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.textContent = key;
                div.dataset.name = key;
                div.onclick = () => loadSkeleton(key);
                list.appendChild(div);
            });
        }

        // ========== 4. 加载并播放 ==========
        function loadSkeleton(name) {
            const data = fileMap[name];
            if (!data) return;

            // 更新状态
            document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
            document.querySelector(`[data-name="${name}"]`).classList.add('active');
            setStatus('加载中: ' + name, 'loading');

            // 销毁旧实例
            if (currentPlayer) {
                currentPlayer.dispose();
                currentPlayer = null;
            }

            // 初始化新实例
            currentPlayer = new spine.SpinePlayer('player', {
                skeleton: data.skel || data.json,
                atlas: data.atlas,
                backgroundColor: CONFIG.defaultBackgroundColor,
                showControls: CONFIG.showControls,
                premultipliedAlpha: CONFIG.premultipliedAlpha,
                alpha: false,
                success: (player) => {
                    setStatus('加载成功: ' + name, 'success');
                },
                error: (player, err) => {
                    setStatus('加载失败: ' + err, 'error');
                    console.error(err);
                }
            });
        }

        // ========== 状态提示 ==========
        function setStatus(text, type = 'loading') {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = 'status ' + type;
        }

        // ========== 启动 ==========
        window.addEventListener('DOMContentLoaded', async () => {
            setStatus('正在扫描文件...', 'loading');
            const files = await scanFiles(CONFIG.rootPath);
            fileMap = buildSkeletonMap(files);
            renderList();
            setStatus('扫描完成，可选择动画', 'success');

            // 默认加载第一个
            const first = Object.keys(fileMap)[0];
            if (first) loadSkeleton(first);
        });
    </script>
</body>
</html>
