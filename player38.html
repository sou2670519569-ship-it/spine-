```html
<!DOCTYPE html>
<html>
<head>

<script src="https://unpkg.com/@esotericsoftware/spine-player@3.8.*/dist/iife/spine-player.js"></script>

<link
rel="stylesheet"
href="https://unpkg.com/@esotericsoftware/spine-player@3.8.*/dist/spine-player.css"
/>

<style>

html,body,#player{
width:100%;
height:100%;
margin:0;
background:#111;
overflow:hidden;
}

</style>

</head>
<body>

<div id="player"></div>

<script>

const params =
new URLSearchParams(location.search)

const spine =
params.get('spine')

const atlas =
params.get('atlas')

new spine.SpinePlayer(
'player',
{
jsonUrl:
spine.endsWith('.json')
? spine
: undefined,

skelUrl:
spine.endsWith('.skel')
? spine
: undefined,

atlasUrl: atlas,

alpha: true,

backgroundColor:'#111111',

showControls:true,

premultipliedAlpha:true,

preserveDrawingBuffer:true
})

</script>

</body>
</html>
```
