<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全自动 Spine 播放器（支持 skel + json）</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#1a1a1a;color:#fff;padding:20px;font-family:Arial}
        #canvas{width:100%;height:700px;background:#000;border:2px solid #fff}
        .panel{margin:20px 0}
        select{padding:10px;font-size:16px;width:400px}
    </style>
</head>
<body>
<h1>全自动 Spine 播放器（支持 json + skel）</h1>
<div class="panel">
    <select id="animSelect"></select>
</div>
<canvas id="canvas"></canvas>

<script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.min.js"></script>
<script>
    const baseUrl = "https://raw.githubusercontent.com/sou2670519569-ship-it/spine-/main/";
    const select = document.getElementById("animSelect");
    let player;

    // 自动扫描所有 Spine 文件（json + skel）
    async function scanSpineFiles() {
        const apiUrl = "https://api.github.com/repos/sou2670519569-ship-it/spine-/git/trees/main?recursive=1";
        const res = await fetch(apiUrl);
        const data = await res.json();
        const paths = data.tree.map(i => i.path);
        
        let animations = [];

        // 识别 json
        paths.filter(p => p.endsWith(".json")).forEach(p => {
            let base = p.replace(".json", "");
            if (paths.includes(base + ".atlas")) {
                animations.push({
                    name: base,
                    json: base + ".json",
                    atlas: base + ".atlas"
                });
            }
        });

        // 识别 skel
        paths.filter(p => p.endsWith(".skel")).forEach(p => {
            let base = p.replace(".skel", "");
            if (paths.includes(base + ".atlas")) {
                animations.push({
                    name: base,
                    skel: base + ".skel",
                    atlas: base + ".atlas"
                });
            }
        });

        // 生成下拉菜单
        animations.forEach((anim, i) => {
            let opt = document.createElement("option");
            opt.value = i;
            opt.textContent = anim.name;
            opt.dataset = anim;
            select.appendChild(opt);
        });

        if (animations.length > 0) loadAnim(0);
    }

    // 自动播放
    function loadAnim(index) {
        let data = select.options[index].dataset;
        if (player) player.dispose();

        let config = {
            atlasUrl: baseUrl + data.atlas,
            alpha: true,
            backgroundColor: "#000"
        };

        if (data.json) config.jsonUrl = baseUrl + data.json;
        if (data.skel) config.skelUrl = baseUrl + data.skel;

        player = new spine.SpinePlayer("canvas", config);
    }

    select.onchange = () => loadAnim(select.value);
    scanSpineFiles();
</script>
</body>
</html>
