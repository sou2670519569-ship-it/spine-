<!DOCTYPE html>
<html lang="zh">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
/>

<title>Spine Viewer</title>

<script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.js"></script>

<link
rel="stylesheet"
href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.css"
/>

<style>

html,body{

    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#1e1e1e;

    color:white;

    font-family:sans-serif;
}

*{
    box-sizing:border-box;
}

#app{

    display:flex;

    width:100%;
    height:100%;
}

/********************************
 * 左边
 ********************************/

#sidebar{

    width:320px;

    background:#2b2b2b;

    border-right:1px solid #444;

    display:flex;

    flex-direction:column;
}

#search{

    height:50px;

    border:none;

    outline:none;

    background:#1f1f1f;

    color:white;

    padding:0 15px;

    font-size:14px;
}

#list{

    flex:1;

    overflow:auto;
}

.item{

    padding:12px;

    border-bottom:1px solid #3a3a3a;

    cursor:pointer;

    transition:.15s;

    word-break:break-all;
}

.item:hover{

    background:#444;
}

.item.active{

    background:#666;
}

/********************************
 * 右边
 ********************************/

#main{

    flex:1;

    position:relative;
}

#player{

    width:100%;
    height:100%;
}

/********************************
 * 工具栏
 ********************************/

#toolbar{

    position:absolute;

    top:10px;
    left:10px;

    z-index:999;

    background:rgba(0,0,0,.6);

    border-radius:10px;

    padding:10px;

    display:flex;

    gap:8px;

    align-items:center;

    flex-wrap:wrap;
}

select,button{

    height:34px;

    border:none;

    border-radius:6px;

    padding:0 12px;
}

button{

    cursor:pointer;
}

/********************************
 * 状态
 ********************************/

#status{

    position:absolute;

    right:10px;
    top:10px;

    z-index:999;

    background:rgba(0,0,0,.5);

    border-radius:8px;

    padding:8px 12px;

    font-size:12px;
}

</style>

</head>

<body>

<div id="app">

    <div id="sidebar">

        <input
            id="search"
            placeholder="搜索..."
        >

        <div id="list"></div>

    </div>

    <div id="main">

        <div id="toolbar">

            <span>动画</span>

            <select id="animSelect"></select>

            <button onclick="playAnimation()">
                播放
            </button>

        </div>

        <div id="status">

            初始化中...

        </div>

        <div id="player"></div>

    </div>

</div>

<script>

/****************************************
 * 配置
 ****************************************/

const USER = "sou2670519569-ship-it";

const REPO = "spine";

const BRANCH = "main";

/****************************************/

const RAW =
`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}`;

/****************************************/

const listEl =
document.getElementById("list");

const statusEl =
document.getElementById("status");

const searchInput =
document.getElementById("search");

const animSelect =
document.getElementById("animSelect");

/****************************************/

let allCharacters = [];

let currentPlayer = null;

/****************************************
 * 状态
 ****************************************/

function setStatus(text){

    statusEl.innerText = text;

    console.log(text);
}

/****************************************
 * 搜索
 ****************************************/

searchInput.oninput = ()=>{

    renderList(searchInput.value);
};

/****************************************
 * 初始化
 ****************************************/

init();

async function init(){

    try{

        setStatus("读取 manifest...");

        const res =
        await fetch("./manifest.json");

        allCharacters =
        await res.json();

        console.log(allCharacters);

        renderList();

        setStatus(
            `加载完成 ${allCharacters.length} 个角色`
        );

    }catch(err){

        console.error(err);

        setStatus(
            "manifest读取失败"
        );
    }
}

/****************************************
 * 渲染列表
 ****************************************/

function renderList(keyword=""){

    listEl.innerHTML = "";

    const lower =
    keyword.toLowerCase();

    const filtered =
    allCharacters.filter(v=>{

        return (

            v.name
            .toLowerCase()
            .includes(lower)

            ||

            v.path
            .toLowerCase()
            .includes(lower)
        );
    });

    for(const item of filtered){

        createItem(item);
    }
}

/****************************************
 * 创建项
 ****************************************/

function createItem(data){

    const div =
    document.createElement("div");

    div.className = "item";

    div.innerText =
    `${data.path}/${data.name}`;

    div.onclick = ()=>{

        document
        .querySelectorAll(".item")
        .forEach(v=>{

            v.classList.remove("active");
        });

        div.classList.add("active");

        loadCharacter(data);
    };

    listEl.appendChild(div);
}

/****************************************
 * 加载角色
 ****************************************/

function loadCharacter(data){

    try{

        setStatus(
            `加载 ${data.name}`
        );

        if(currentPlayer){

            try{
                currentPlayer.dispose();
            }catch(e){}
        }

        document
        .getElementById("player")
        .innerHTML = "";

        const encodedPath =
        data.path
        .split("/")
        .map(encodeURIComponent)
        .join("/");

        const base =
        `${RAW}/${encodedPath}`;

        const config = {

            alpha:true,

            backgroundColor:"#1e1e1e",

            premultipliedAlpha:false,

            success:(player)=>{

                currentPlayer = player;

                setupAnimations(player);

                setStatus(
                    `已加载 ${data.name}`
                );
            },

            error:(err)=>{

                console.error(err);

                setStatus(
                    `加载失败 ${data.name}`
                );
            }
        };

        /********************************
         * atlas
         ********************************/

        if(data.atlas){

            config.atlasUrl =
            `${base}/${encodeURIComponent(data.atlas)}`;
        }

        /********************************
         * json
         ********************************/

        if(data.json){

            config.jsonUrl =
            `${base}/${encodeURIComponent(data.json)}`;
        }

        /********************************
         * skel
         ********************************/

        if(data.skel){

            config.skelUrl =
            `${base}/${encodeURIComponent(data.skel)}`;
        }

        console.log(config);

        new spine.SpinePlayer(
            "player",
            config
        );

    }catch(err){

        console.error(err);

        setStatus("播放失败");
    }
}

/****************************************
 * 动画
 ****************************************/

function setupAnimations(player){

    animSelect.innerHTML = "";

    const animations =
    player.skeleton.data.animations;

    for(const anim of animations){

        const option =
        document.createElement("option");

        option.value =
        anim.name;

        option.innerText =
        anim.name;

        animSelect.appendChild(option);
    }

    if(animations.length){

        player.setAnimation(
            animations[0].name,
            true
        );
    }
}

/****************************************
 * 播放
 ****************************************/

function playAnimation(){

    if(!currentPlayer)
        return;

    currentPlayer.setAnimation(
        animSelect.value,
        true
    );
}

</script>

</body>
</html>
