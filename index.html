<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Spine 全自动轮播（终极版）</title>
<link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.24/dist/spine-player.min.css">
<script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.24/dist/iife/spine-player.min.js"></script>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; }
    #player { width:100vw; height:100vh; }
    #status {
        position:fixed; top:10px; left:10px; color:#fff;
        background:rgba(0,0,0,0.7); padding:10px 16px;
        font-size:15px; border-radius:8px; z-index:999;
    }
</style>
</head>
<body>
<div id="status">正在扫描所有 Spine 动画...</div>
<div id="player"></div>

<script>
// ================= 配置 =================
const BASE_URL = "https://sou2670519569-ship-it.github.io/spine-/";
const PLAY_SECONDS = 6; // 每个动画播放几秒

// ================= 深度扫描：根目录 + 所有文件夹 =================
async function scanAllSpine() {
    const animations = [];
    const scannedFolders = new Set();

    async function scanFolder(folder) {
        if (scannedFolders.has(folder)) return;
        scannedFolders.add(folder);

        try {
            const url = folder ? `${BASE_URL}${folder}/` : BASE_URL;
            const res = await fetch(url);
            const text = await res.text();

            // 找子文件夹
            const folderRegex = /href="([^\/]+)\/"/g;
            let fmatch;
            while ((fmatch = folderRegex.exec(text)) !== null) {
                const sub = fmatch[1];
                if (!sub.includes(".") && sub !== "..") {
                    await scanFolder(folder ? `${folder}/${sub}` : sub);
                }
            }

            // 找 Spine 动画文件
            const regex = /href="([^"]+\.(json|skel))"/g;
            let match;
            const found = new Set();
            while ((match = regex.exec(text)) !== null) {
                const file = match[1];
                const name = file.replace(/\.(json|skel)$/, "");
                const fullPath = folder ? `${folder}/${name}` : name;
                found.add(fullPath);
            }

            for (const p of found) animations.push(p);
        } catch (e) {}
    }

    await scanFolder("");
    return [...new Set(animations)];
}

// ================= 播放单个动画 =================
function play(fullPath) {
    return new Promise(async (resolve) => {
        try {
            document.getElementById("status").innerText = `🎬 播放：${fullPath}`;

            const json = `${BASE_URL}${fullPath}.json`;
            const skel = `${BASE_URL}${fullPath}.skel`;
            const atlas = `${BASE_URL}${fullPath}.atlas`;

            const config = {
                atlasUrl: atlas,
                autoplay: true,
                loop: true,
                backgroundColor: "#000",
                viewportBackgroundColor: "#000",
                success: () => setTimeout(resolve, PLAY_SECONDS * 1000),
                error: resolve
            };

            if (await fetch(json).then(r => r.ok)) config.jsonUrl = json;
            else config.skelUrl = skel;

            new spine.SpinePlayer("player", config);
        } catch (e) { resolve(); }
    });
}

// ================= 自动轮播 =================
async function start() {
    const list = await scanAllSpine();

    if (list.length === 0) {
        document.getElementById("status").innerText = "❌ 未找到任何 Spine 动画";
        return;
    }

    document.getElementById("status").innerText = `✅ 共找到 ${list.length} 个动画，开始播放`;

    while (true) {
        for (const item of list) await play(item);
    }
}

start();
</script>
</body>
</html>
