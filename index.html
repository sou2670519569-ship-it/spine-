<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Spine Auto Viewer</title>
<script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#1a1a1a;color:#fff;padding:16px}
.container{max-width:1280px;margin:0 auto}
h1{text-align:center;margin-bottom:16px;font-size:22px}
.top-bar{display:flex;gap:8px;margin-bottom:12px}
#repoInput{flex:1;padding:10px;background:#2b2b2b;border:1px solid #444;border-radius:6px;color:#fff}
#fetchBtn{padding:10px 16px;background:#2563eb;border:none;border-radius:6px;color:#fff;cursor:pointer}
.list-wrap{display:grid;grid-template-columns:1fr 320px;gap:12px;margin-bottom:12px}
.file-list{background:#222;border-radius:6px;padding:10px;max-height:220px;overflow:auto}
.file-item{padding:6px 8px;margin:4px 0;background:#333;border-radius:4px;cursor:pointer}
.file-item:hover{background:#444}
.ctrl{background:#222;padding:12px;border-radius:6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctrl input{width:90px;padding:6px;background:#333;border:none;border-radius:4px;color:#fff}
#canvasWrap{background:#000;border-radius:6px;overflow:hidden}
#spineCanvas{width:100%;height:620px;display:block}
.tip{margin-top:10px;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div class="container">
    <h1>Spine 全自动查看器</h1>
    <div class="top-bar">
        <input id="repoInput" placeholder="粘贴GitHub仓库地址：https://github.com/xxx/xxx">
        <button id="fetchBtn">自动读取全部Spine文件</button>
    </div>

    <div class="list-wrap">
        <div class="file-list" id="fileList">
            <div style="color:#888">等待读取仓库文件...</div>
        </div>
        <div class="ctrl">
            <div>X:<input type="number" id="posX" value="0.5" step="0.01"></div>
            <div>Y:<input type="number" id="posY" value="0.5" step="0.01"></div>
            <div>缩放:<input type="number" id="scale" value="1" step="0.1"></div>
            <div>背景:<input type="color" id="bgColor" value="#000000"></div>
        </div>
    </div>

    <div id="canvasWrap">
        <canvas id="spineCanvas"></canvas>
    </div>
    <div class="tip" id="tip">提示：先填仓库链接 → 读取文件 → 点击列表项目自动播放</div>
</div>

<script>
let player = null;
let baseRaw = "";
const canvas = document.getElementById("spineCanvas");
const repoInput = document.getElementById("repoInput");
const fileList = document.getElementById("fileList");
const tip = document.getElementById("tip");

// 解析GitHub仓库
function parseGitUrl(url) {
    const m = url.match(/github\.com\/([^\/]+)\/([^\/]+)/);
    return m ? {user:m[1],repo:m[2]} : null;
}

// 递归获取仓库所有文件，筛选spine后缀
async function getSpineFiles(user, repo) {
    let files = [];
    async function scan(path) {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`);
        if(!res.ok) return;
        const data = await res.json();
        for(let item of data) {
            if(item.type === "dir") await scan(item.path);
            else {
                const name = item.name.toLowerCase();
                if(name.endsWith(".json")||name.endsWith(".skel")||name.endsWith(".atlas")){
                    files.push(item.path);
                }
            }
        }
    }
    await scan("");
    return files;
}

// 加载spine动画
function playSpine(jsonPath, atlasPath) {
    if(player) player.dispose();
    tip.innerText = "加载："+jsonPath;
    player = new spine.SpinePlayer(canvas,{
        jsonUrl: baseRaw + jsonPath,
        atlasUrl: baseRaw + atlasPath,
        backgroundColor: document.getElementById("bgColor").value,
        position:{
            x:+document.getElementById("posX").value,
            y:+document.getElementById("posY").value
        },
        scale:+document.getElementById("scale").value,
        success:()=>tip.innerText="播放成功："+jsonPath,
        error:()=>tip.innerText="缺少对应atlas或资源失败"
    });
}

// 匹配json/skel 和 atlas
function matchAtlas(list, jsonFile) {
    const base = jsonFile.replace(/\.(json|skel)$/i,"");
    return list.find(v=>v.toLowerCase()===base+".atlas");
}

// 读取仓库按钮
document.getElementById("fetchBtn").addEventListener("click",async ()=>{
    const url = repoInput.value.trim();
    const info = parseGitUrl(url);
    if(!info) { tip.innerText="仓库地址错误";return; }
    baseRaw = `https://raw.githubusercontent.com/${info.user}/${info.repo}/main/`;
    fileList.innerHTML = "<div style='color:#888'>读取中...</div>";
    try{
        const files = await getSpineFiles(info.user, info.repo);
        const jsonList = files.filter(v=>v.endsWith(".json")||v.endsWith(".skel"));
        fileList.innerHTML = "";
        jsonList.forEach(item=>{
            const div = document.createElement("div");
            div.className = "file-item";
            div.innerText = item;
            div.onclick = ()=>{
                const atlas = matchAtlas(files, item);
                if(atlas) playSpine(item, atlas);
                else tip.innerText="未找到对应atlas文件";
            };
            fileList.appendChild(div);
        });
        tip.innerText=`共找到 ${jsonList.length} 个Spine动画，点击播放`;
    }catch(e){
        tip.innerText="读取仓库失败（仓库需公开）";
    }
});

// 实时更新位置/缩放/背景
["posX","posY","scale","bgColor"].forEach(id=>{
    document.getElementById(id).addEventListener("input",()=>{
        if(!player)return;
        player.position.x = +document.getElementById("posX").value;
        player.position.y = +document.getElementById("posY").value;
        player.scale = +document.getElementById("scale").value;
        canvas.style.background = document.getElementById("bgColor").value;
    })
})
</script>
</body>
</html>
