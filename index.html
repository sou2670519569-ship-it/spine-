<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spine 全自动递归播放器</title>
<link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#111;color:#eee;font-family:system-ui}
#player{width:100%;height:70vh;border:1px solid #333;border-radius:8px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;align-items:center}
.controls select,input,button{padding:8px 12px;background:#222;border:1px solid #444;color:#fff;border-radius:6px}
</style>
</head>
<body>

<div class="controls">
  <select id="fileList" style="flex:1;"><option>加载中...</option></select>
  <input type="number" id="scale" value="1" step="0.1" placeholder="缩放">
  <input type="color" id="bgColor" value="#000000">
  <button onclick="loadCurrent()">刷新</button>
</div>
<div id="player"></div>

<script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.min.js"></script>
<script>
// ===========================
// 你的仓库配置（已填好）
// ===========================
const CONFIG = {
  userName: "sou2670519569-ship-it",
  repoName: "spine-",
  branch: "main"
};

const RAW_URL = `https://raw.githubusercontent.com/${CONFIG.userName}/${CONFIG.repoName}/${CONFIG.branch}/`;
const API_URL = `https://api.github.com/repos/${CONFIG.userName}/${CONFIG.repoName}/contents?ref=${CONFIG.branch}`;

let player = null;
let allFiles = [];

// 递归扫描所有子文件夹
async function scanDirectory(url, prefix = "") {
  const res = await fetch(url, {
    headers: { Accept: "application/vnd.github.v3+json" }
  });
  const items = await res.json();

  for (const item of items) {
    if (item.type === "dir") {
      // 递归进入子文件夹
      await scanDirectory(
        `https://api.github.com/repos/${CONFIG.userName}/${CONFIG.repoName}/contents/${item.path}?ref=${CONFIG.branch}`,
        `${prefix}${item.name}/`
      );
    } else if (item.type === "file") {
      // 筛选 JSON/SKEL 文件
      if (item.name.endsWith(".json") || item.name.endsWith(".skel")) {
        allFiles.push({
          path: `${prefix}${item.name}`,
          name: `${prefix}${item.name}`
        });
      }
    }
  }
}

// 渲染下拉列表
function renderList() {
  const el = document.getElementById("fileList");
  el.innerHTML = "";
  if (allFiles.length === 0) {
    el.innerHTML = `<option>未找到任何文件，请检查路径</option>`;
    return;
  }
  allFiles.forEach(file => {
    const opt = document.createElement("option");
    opt.value = file.path;
    opt.innerText = file.name;
    el.appendChild(opt);
  });
}

// 加载选中的动画
function loadCurrent() {
  const file = document.getElementById("fileList").value;
  if (!file) return;

  if (player) player.dispose();

  const isJson = file.endsWith(".json");
  const isSkel = file.endsWith(".skel");
  const atlasUrl = RAW_URL + file.replace(/\.(json|skel)$/, ".atlas");

  const config = {
    atlasUrl,
    backgroundColor: document.getElementById("bgColor").value,
    scale: parseFloat(document.getElementById("scale").value) || 1,
    premultipliedAlpha: true,
    x: 0.5, y: 0.5
  };

  if (isJson) config.jsonUrl = RAW_URL + file;
  if (isSkel) config.skelUrl = RAW_URL + file;

  player = new spine.SpinePlayer("player", config);
}

// 启动：扫描所有文件夹
window.onload = async () => {
  try {
    await scanDirectory(API_URL);
    renderList();
    document.getElementById("fileList").addEventListener("change", loadCurrent);
  } catch (e) {
    document.getElementById("fileList").innerHTML = `<option>扫描失败，请检查仓库权限</option>`;
    console.error(e);
  }
};
</script>
</body>
</html>
