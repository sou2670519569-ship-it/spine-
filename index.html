const PLAY_DURATION = 6000;
const BASE_URL = "https://sou2670519569-ship-it.github.io/spine-/";

// 播放单个动画
function playAnimation(path) {
    return new Promise(async (resolve) => {
        try {
            document.getElementById("status").innerText = `🎬 正在播放：\n${path}`;
            
            let skelUrl = BASE_URL + path + ".skel";
            let atlasUrl = BASE_URL + path + ".atlas";

            let config = {
                skelUrl: skelUrl,
                atlasUrl: atlasUrl,
                autoplay: true,
                loop: true,
                backgroundColor: "#000",
                viewportBackgroundColor: "#000",
                success: () => {
                    setTimeout(resolve, PLAY_DURATION);
                },
                error: () => {
                    console.warn("加载失败：", path);
                    resolve();
                }
            };

            new spine.SpinePlayer("player", config);
        } catch (e) {
            resolve();
        }
    });
}

// 自动轮播
async function startPlay() {
    if (ANIMATIONS.length === 0) {
        document.getElementById("status").innerText = "❌ 未找到任何动画";
        return;
    }

    document.getElementById("status").innerText = `✅ 已加载 ${ANIMATIONS.length} 个动画，开始播放`;

    while (true) {
        for (let anim of ANIMATIONS) {
            await playAnimation(anim);
        }
    }
}

startPlay();
