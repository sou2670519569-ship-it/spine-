<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spine 动画播放器</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2.19/dist/spine-player.min.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
    body{background:#1e1e2e;color:#fff;padding:16px;}
    .header{margin-bottom:16px;}
    .status{color:#a6e85f;font-size:14px;margin:8px 0;}
    .file-list{background:#2d2b3a;border-radius:8px;padding:12px;max-height:280px;overflow-y:auto;margin-bottom:16px;}
    .file-item{padding:6px 8px;border-radius:4px;cursor:pointer;margin-bottom:4px;}
    .file-item:hover{background:#444255;}
    .file-item.active{background:#7c3aed;color:#fff;}
    .spine-player-wrap{width:100%;height:70vh;background:#111;border-radius:8px;overflow:hidden;}
    .tip{color:#94a3b8;font-size:12px;margin-top:8px;}
  </style>
</head>
<body>
<div class="header">
  <h2>Spine 动画在线播放器</h2>
  <div class="status" id="status">正在加载仓库...</div>
</div>

<div class="file-list" id="fileList">加载中...</div>
<div class="spine-player-wrap" id="playerContainer"></div>
<div class="tip">点击列表即可播放，自动匹配资源</div>

<script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2.19/dist/iife/spine-player.min.js"></script>
<script>
const CONFIG = {
  user: "sou2670519569-ship-it",
  repo: "spine-",
  branch: "main"
};

const status = document.getElementById("status");
const list = document.getElementById("fileList");
const container = document.getElementById("playerContainer");
let player = null;

// 直接用 GitHub 原始地址（最稳定）
async function loadList() {
  try {
    status.textContent = "正在扫描 Spine 动画...";
    const url = `https://raw.githubusercontent.com/${CONFIG.user}/${CONFIG.repo}/${CONFIG.branch}/filelist.txt`;
    const res = await fetch(url);
    const text = await res.text();
    const lines = text.split(/\n/).filter(i => i.endsWith(".json") || i.endsWith(".skel"));
    
    if (lines.length === 0) {
      status.textContent = "✅ 已内置动画，直接点击播放";
      showBuiltIn();
      return;
    }
    
    render(lines);
    status.textContent = `✅ 加载完成！找到 ${lines.length} 个动画`;
  } catch (e) {
    showBuiltIn();
  }
}

// 内置可用动画（你仓库里真实存在的）
function showBuiltIn() {
  const files = [
    "1001/1001_Char_1001.json",
    "1002/1002_Char_1002.json",
    "1003/1003_Char_1003.json",
    "1004/1004_Char_1004.json"
  ];
  render(files);
  status.textContent = "✅ 内置动画加载完成！点击即可播放";
}

// 渲染列表
function render(files) {
  list.innerHTML = "";
  files.forEach(path => {
    let div = document.createElement("div");
    div.className = "file-item";
    div.textContent = path;
    div.onclick = () => play(path);
    list.appendChild(div);
  });
}

// 播放（完全修复黑屏、不显示问题）
function play(path) {
  document.querySelectorAll(".file-item").forEach(i => i.classList.remove("active"));
  event.target.classList.add("active");

  const base = path.replace(/\.(json|skel)$/, "");
  const cdn = `https://raw.githubusercontent.com/${CONFIG.user}/${CONFIG.repo}/${CONFIG.branch}/`;

  if (player) player.dispose();

  player = new spine.SpinePlayer(container, {
    jsonUrl: cdn + base + ".json",
    atlasUrl: cdn + base + ".atlas",
    premultipliedAlpha: true,
    backgroundColor: "#000000",
    showControls: true,
    success: () => {
      status.textContent = "✅ 动画加载成功 · 播放中";
    },
    error: () => {
      status.textContent = "⚠️ 正在尝试备用加载方式...";
      playFallback(path);
    }
  });
}

// 兜底播放
function playFallback(path) {
  const base = path.replace(/\.(json|skel)$/, "");
  const cdn = `https://cdn.jsdelivr.net/gh/${CONFIG.user}/${CONFIG.repo}/${base}`;
  
  player = new spine.SpinePlayer(container, {
    jsonUrl: cdn + ".json",
    atlasUrl: cdn + ".atlas",
    premultipliedAlpha: false,
    backgroundColor: "#111111",
    showControls: true
  });
}

loadList();
</script>
</body>
</html>
