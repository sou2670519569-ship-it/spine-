<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Spine Gallery</title>
    <!-- 引入 Spine Web Player 脚本 -->
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.1.*/dist/iife/spine-player.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.1.*/dist/spine-player.css">
    <style>
        body { background: #222; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #player-container { width: 80%; height: 80vh; border: 1px solid #444; }
    </style>
</head>
<body>

<div id="player-container"></div>

<script>
    new spine.SpinePlayer("player-container", {
        skelUrl: "assets/character.skel", // 替换为你的文件路径
        atlasUrl: "assets/character.atlas", // 替换为你的文件路径
        animation: "idle", // 初始播放的动画名称
        premultipliedAlpha: true,
        backgroundColor: "#222222",
        showControls: true // 显示控制条，方便其他人切换动画或皮肤
    });
</script>

</body>
</html>
