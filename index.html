<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Spine 在线播放</title>
<link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.min.css">
<script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.min.js"></script>
<style>
#player { width:800px; height:600px; margin:20px auto; }
</style>
</head>
<body>
<div id="player"></div>

<script>
// 播放 0000_1-1
new spine.SpinePlayer("player", {
  jsonUrl: "https://raw.githubusercontent.com/sou2670519569-ship-it/spine-/main/0000_1-1.json",
  atlasUrl: "https://raw.githubusercontent.com/sou2670519569-ship-it/spine-/main/0000_1-1.atlas",
  autoplay: true,
  loop: true
});
