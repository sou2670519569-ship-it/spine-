<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 Spine 动画库</title>
<style>
  html,body { margin:0; padding:0; width:100%; height:100%; background:#111; }
  #player { width:100%; height:100%; }
</style>
</head>
<body>
<div id="player"></div>

<!-- 官方原版 Spine Player（带右下角LOGO + 完整文件浏览器）-->
<script src="https://unpkg.com/@esotericsoftware/spine-player@4.1/dist/iife/spine-player.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.1/dist/spine-player.min.css">

<script>
// ==============================================
// 你的 GitHub 仓库地址（已自动填好！）
// ==============================================
const BASE_URL = "https://raw.githubusercontent.com/sou2670519569-ship-it/spine-/main/";

new spine.SpinePlayer("player", {
    // 自动加载你仓库里的动画
    jsonUrl: BASE_URL + "1.json",
    atlasUrl: BASE_URL + "1.atlas",
    
    // 官方原版功能
    showControls: true,
    showList: true,        // 显示文件列表（读取所有文件）
    showToolbar: true,
    backgroundColor: "#1a1a1a",
    autoplay: true,
    loop: true
});
</script>
</body>
</html>
