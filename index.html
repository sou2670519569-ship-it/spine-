<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spine 动画在线播放器</title>
  <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.19/dist/spine-player.min.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
    body{background:#1e1e2e;color:#fff;padding:16px;}
    .header{margin-bottom:16px;}
    .repo-info{color:#a6adc8;font-size:14px;margin-bottom:8px;}
    .file-list{background:#2d2b3a;border-radius:8px;padding:12px;max-height:300px;overflow-y:auto;margin-bottom:16px;}
    .file-item{padding:6px 8px;border-radius:4px;cursor:pointer;margin-bottom:4px;}
    .file-item:hover{background:#444255;}
    .file-item.active{background:#7c3aed;color:#fff;}
    .spine-player-wrap{width:100%;height:70vh;background:#111;border-radius:8px;overflow:hidden;}
    .tip{color:#94a3b8;font-size:12px;margin-top:8px;}
  </style>
</head>
<body>
<div class="header">
  <h2>GitHub Spine 动画在线播放器</h2>
  <div class="repo-info">仓库：sou2670519569-ship-it/spine-</div>
</div>

<div class="file-list" id="fileList">加载中...</div>
<div class="spine-player-wrap" id="playerContainer"></div>
<div class="tip">自动识别 .json/.skel + .atlas + .png 即可播放</div>

<script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.19/dist/iife/spine-player.min.js"></script>
<script>
const CONFIG = {
  owner: 'sou2670519569-ship-it',
  repo: 'spine-',
  branch: 'main'
}

const fileListEl = document.getElementById('fileList')
const playerContainer = document.getElementById('playerContainer')
let currentPlayer = null
let repoFiles = []

// 1. 拉取仓库文件
async function fetchRepoFiles(path = '') {
  try {
    const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}?ref=${CONFIG.branch}`
    const res = await fetch(url)
    if (!res.ok) throw new Error('获取失败')
    return await res.json()
  } catch (err) {
    console.error(err)
    return []
  }
}

// 2. 递归获取所有文件
async function getAllFiles(path = '') {
  const items = await fetchRepoFiles(path)
  for (const item of items) {
    if (item.type === 'dir') {
      await getAllFiles(item.path)
    } else {
      repoFiles.push(item)
    }
  }
}

// 3. 匹配同目录 Spine 三件套
function findSpineGroup(file) {
  const base = file.path.replace(/\.(json|skel)$/, '')
  const json = repoFiles.find(f => f.path === base + '.json')
  const skel = repoFiles.find(f => f.path === base + '.skel')
  const atlas = repoFiles.find(f => f.path === base + '.atlas')
  const png = repoFiles.find(f => f.path === base + '.png')
  return { json, skel, atlas, png }
}

// 4. 播放 Spine
function playSpine(file) {
  const g = findSpineGroup(file)
  if ((!g.json && !g.skel) || !g.atlas || !g.png) {
    alert('未找到完整的 .json/.skel + .atlas + .png')
    return
  }
  if (currentPlayer) currentPlayer.dispose()

  currentPlayer = new spine.SpinePlayer(playerContainer, {
    jsonUrl: g.json?.download_url || '',
    skelUrl: g.skel?.download_url || '',
    atlasUrl: g.atlas.download_url,
    premultipliedAlpha: true,
    showControls: true,
    backgroundColor: '#111111'
  })
}

// 5. 渲染文件列表
function renderFileList() {
  fileListEl.innerHTML = ''
  const spineFiles = repoFiles.filter(f => f.name.endsWith('.json') || f.name.endsWith('.skel'))
  spineFiles.forEach(file => {
    const div = document.createElement('div')
    div.className = 'file-item'
    div.textContent = file.path
    div.onclick = () => {
      document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'))
      div.classList.add('active')
      playSpine(file)
    }
    fileListEl.appendChild(div)
  })
}

// 启动
async function init() {
  await getAllFiles()
  renderFileList()
}
init()
</script>
</body>
</html>
