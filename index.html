<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">

<title>Spine Viewer</title>

<script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.js"></script>

<link rel="stylesheet"
href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.css">

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#1e1e1e;
    color:white;
    font-family:sans-serif;
}

#app{
    display:flex;
    width:100%;
    height:100%;
}

#left{
    width:260px;
    background:#2b2b2b;
    overflow-y:auto;
    border-right:1px solid #444;
}

#right{
    flex:1;
    position:relative;
}

#player{
    width:100%;
    height:100%;
}

.item{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #3a3a3a;
}

.item:hover{
    background:#444;
}

.item.active{
    background:#666;
}

#topbar{
    position:absolute;
    top:10px;
    left:10px;
    z-index:999;
    background:rgba(0,0,0,.5);
    padding:10px;
    border-radius:8px;
}

select{
    padding:5px;
    font-size:14px;
}

button{
    margin-left:5px;
    padding:5px 10px;
}

</style>
</head>

<body>

<div id="app">

    <div id="left"></div>

    <div id="right">

        <div id="topbar">

            动画：
            <select id="animSelect"></select>

            <button onclick="setAnimation()">播放</button>

        </div>

        <div id="player"></div>

    </div>

</div>

<script>

/***********************
 *
 * 修改这里
 *
 ***********************/

const USER = "你的GitHub用户名";
const REPO = "你的仓库名";
const BRANCH = "main";

/**********************/

const API =
`https://api.github.com/repos/${USER}/${REPO}/contents`;

const RAW =
`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}`;

const left = document.getElementById("left");

const animSelect = document.getElementById("animSelect");

let currentPlayer = null;

let currentData = null;

/*********************************
 *
 * 读取仓库目录
 *
 *********************************/

async function loadRepo(){

    const res = await fetch(API);

    const list = await res.json();

    const folders = list.filter(v => v.type === "dir");

    for(const folder of folders){

        createItem(folder.name);
    }
}

/*********************************
 *
 * 创建左侧角色按钮
 *
 *********************************/

function createItem(name){

    const div = document.createElement("div");

    div.className = "item";

    div.innerText = name;

    div.onclick = () => {

        document
        .querySelectorAll(".item")
        .forEach(v=>v.classList.remove("active"));

        div.classList.add("active");

        loadCharacter(name);
    };

    left.appendChild(div);
}

/*********************************
 *
 * 加载角色
 *
 *********************************/

async function loadCharacter(folder){

    try{

        const url =
        `${API}/${encodeURIComponent(folder)}`;

        const res = await fetch(url);

        const files = await res.json();

        let jsonFile = null;
        let skelFile = null;
        let atlasFile = null;

        for(const f of files){

            if(f.name.endsWith(".json"))
                jsonFile = f.name;

            if(f.name.endsWith(".skel"))
                skelFile = f.name;

            if(f.name.endsWith(".atlas"))
                atlasFile = f.name;
        }

        if(!atlasFile){

            alert(folder + " 缺少 atlas");

            return;
        }

        const base =
        `${RAW}/${encodeURIComponent(folder)}`;

        currentData = {
            folder,
            json: jsonFile,
            skel: skelFile,
            atlas: atlasFile
        };

        createPlayer(base);

    }catch(err){

        console.error(err);

        alert("加载失败");
    }
}

/*********************************
 *
 * 创建播放器
 *
 *********************************/

function createPlayer(base){

    document.getElementById("player").innerHTML = "";

    if(currentPlayer){

        try{
            currentPlayer.dispose();
        }catch(e){}
    }

    const config = {

        atlasUrl:
        `${base}/${currentData.atlas}`,

        alpha:true,

        backgroundColor:"#1e1e1e",

        premultipliedAlpha:false,

        success:(player)=>{

            currentPlayer = player;

            loadAnimations(player);
        },

        error:(err)=>{

            console.error(err);

            alert("Spine加载失败");
        }
    };

    if(currentData.json){

        config.jsonUrl =
        `${base}/${currentData.json}`;
    }

    if(currentData.skel){

        config.skelUrl =
        `${base}/${currentData.skel}`;
    }

    new spine.SpinePlayer(
        "player",
        config
    );
}

/*********************************
 *
 * 动画列表
 *
 *********************************/

function loadAnimations(player){

    animSelect.innerHTML = "";

    const animations =
    player.skeleton.data.animations;

    for(const anim of animations){

        const option =
        document.createElement("option");

        option.value = anim.name;

        option.innerText = anim.name;

        animSelect.appendChild(option);
    }

    if(animations.length){

        player.setAnimation(
            animations[0].name,
            true
        );
    }
}

/*********************************
 *
 * 播放动画
 *
 *********************************/

function setAnimation(){

    if(!currentPlayer) return;

    const name =
    animSelect.value;

    currentPlayer.setAnimation(
        name,
        true
    );
}

/*********************************
 *
 * 启动
 *
 *********************************/

loadRepo();

</script>

</body>
</html>
