<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spine Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="left">
    <canvas id="spineCanvas"></canvas>
  </div>
  <div class="right">
    <div class="cfg-item">
      <label>动画</label>
      <select id="animSelect"></select>
    </div>
    <div class="cfg-item">
      <label>速度</label>
      <input type="number" id="speedVal" value="1" step="0.1" min="0.1" max="3">
    </div>
    <div class="cfg-item">
      <label>缩放</label>
      <input type="number" id="scaleVal" value="1" step="0.1" min="0.1" max="5">
    </div>
    <div class="cfg-item">
      <label>X 偏移</label>
      <input type="number" id="offsetX" value="0" step="10">
    </div>
    <div class="cfg-item">
      <label>Y 偏移</label>
      <input type="number" id="offsetY" value="0" step="10">
    </div>
    <div class="cfg-item">
      <label>背景色</label>
      <input type="color" id="bgColor" value="#000000">
    </div>
    <button id="reloadBtn">重新加载</button>
    <div class="tip">
      自动读取当前目录 / 子目录所有 Spine json/skel 资源
    </div>
  </div>
</div>

<script src="https://unpkg.com/@esotericsoftware/spine-web@4.1.28/dist/spine-web.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
