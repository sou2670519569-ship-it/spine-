
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine 动画播放器</title>
<link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.1.0/dist/spine-player.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;background:#1a1a1a;color:#fff}
#sidebar{width:280px;background:#2a2a2a;padding:12px;overflow-y:auto;border-right:1px solid #444}
#player{flex:1;position:relative}
.folder{margin:8px 0 4px 4px;font-weight:bold;color:#4fc3f7}
.anim{padding:6px 10px;margin:3px 0;background:#3a3a3a;border-radius:6px;cursor:pointer}
.anim:hover{background:#4a4a4a}
</style>
</head>
<body>
<div id="sidebar">正在加载动画列表...</div>
<div id="player"></div>

<script src="https://unpkg.com/@esotericsoftware/spine-player@4.1.0/dist/iife/spine-player.min.js"></script>
<script>
let player = null;
const baseUrl = window.location.href;

// 直接手动定义你的动画路径（适配你的仓库结构）
const animations = [
  // 格式：{ name: "显示名称", skeleton: "文件路径", atlas: "文件路径" }
  // 示例路径：三国志幻想大陆/100001/skeleton.skel
  {
    name: "三国志幻想大陆/100001/skeleton",
    skeleton: "三国志幻想大陆/100001/skeleton.skel",
    atlas: "三国志幻想大陆/100001/skeleton.atlas"
  },
  {
    name: "三国志幻想大陆/102001/skeleton",
    skeleton: "三国志幻想大陆/102001/skeleton.skel",
    atlas: "三国志幻想大陆/102001/skeleton.atlas"
  }
  // 你可以继续按这个格式添加其他文件夹里的动画
];

// 渲染列表并绑定点击事件
function renderList() {
  const sidebar = document.getElementById('sidebar');
  if (animations.length === 0) {
    sidebar.innerHTML = "❌ 未配置任何动画，请按格式添加路径";
    return;
  }

  sidebar.innerHTML = "";
  const folderMap = {};
  animations.forEach(anim => {
    const parts = anim.name.split('/');
    const folder = parts.slice(0, -1).join('/') || '根目录';
    if (!folderMap[folder]) folderMap[folder] = [];
    folderMap[folder].push({ name: parts.pop(), ...anim });
  });

  for (const folder in folderMap) {
    const folderDiv = document.createElement('div');
    folderDiv.className = 'folder';
    folderDiv.textContent = `📂 ${folder}`;
    sidebar.appendChild(folderDiv);

    folderMap[folder].forEach(anim => {
      const item = document.createElement('div');
      item.className = 'anim';
      item.textContent = anim.name;
      item.onclick = () => loadAnimation(anim.skeleton, anim.atlas);
      sidebar.appendChild(item);
    });
  }
}

// 加载动画
function loadAnimation(skeletonPath, atlasPath) {
  if (player) player.dispose();
  player = new spine.SpinePlayer('player', {
    skeleton: skeletonPath,
    atlas: atlasPath,
    alpha: true,
    showControls: true,
    backgroundColor: "#111",
    premultipliedAlpha: false
  });
}

// 初始化
renderList();
</script>
</body>
</html>
