<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自动识别 Spine 播放器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    #canvas {
      border: 2px solid #444;
      border-radius: 10px;
      background: #000;
      width: 100%;
      max-width: 600px;
      height: 600px;
    }

    .panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .file-list {
      max-height: 180px;
      overflow-y: auto;
      width: 100%;
      max-width: 600px;
      background: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .file-item {
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 4px;
      margin: 2px 0;
    }

    .file-item:hover {
      background: #2a2a2a;
    }

    .file-item.active {
      background: #007bff;
    }

    .anim-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 600px;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .tip {
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }

    .status {
      color: #00d8ff;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📁 自动识别 Spine 播放器</h1>
    <p class="status">正在扫描仓库中的 Spine 文件...</p>

    <div class="file-list" id="fileList"></div>

    <canvas id="canvas"></canvas>

    <div class="anim-list" id="animList"></div>

    <div class="panel">
      <button onclick="pauseAnim()">⏸ 暂停</button>
      <button onclick="resumeAnim()">▶ 继续</button>
    </div>

    <p class="tip">
      支持格式：.json / .skel<br>
      自动识别：所有子文件夹 | 自动配对 atlas + png
    </p>
  </div>

  <!-- Spine 官方库 -->
  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.1.2/dist/iife/spine-player.min.js"></script>

  <script>
    const canvas = document.getElementById('canvas');
    const fileList = document.getElementById('fileList');
    const animList = document.getElementById('animList');
    const status = document.querySelector('.status');

    let player;
    let currentFile;
    let spineFiles = [];

    // ======================================
    // 1. 自动扫描所有文件（包括子文件夹）
    // ======================================
    async function scanAllFiles(path = '') {
      try {
        const res = await fetch(path);
        const text = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const links = doc.querySelectorAll('a');

        for (const a of links) {
          const href = a.getAttribute('href');
          if (!href || href.startsWith('?') || href.startsWith('#')) continue;

          // 识别 Spine 文件
          if (href.endsWith('.json') || href.endsWith('.skel')) {
            spineFiles.push(path + href);
          }

          // 递归扫描子文件夹
          if (href.endsWith('/') && !path.includes(href)) {
            await scanAllFiles(path + href);
          }
        }
      } catch (e) {}
    }

    // ======================================
    // 2. 加载选中的 Spine
    // ======================================
    async function loadSpine(file) {
      currentFile = file;
      status.textContent = `正在加载：${file}`;
      animList.innerHTML = '';

      if (player) player.dispose();

      const base = file.replace(/\.(json|skel)$/, '');
      const isSkel = file.endsWith('.skel');

      player = new spine.SpinePlayer(canvas, {
        [isSkel ? 'skelUrl' : 'jsonUrl']: file,
        atlasUrl: base + '.atlas',
        pngUrl: base + '.png',
        scale: 0.3,
        premultipliedAlpha: true,
        backgroundColor: '#00000000',
        success: (skeleton) => {
          status.textContent = `✅ 加载成功：${file}`;
          createAnimButtons(skeleton.data.animations);
        },
        error: (err) => {
          status.textContent = `❌ 加载失败：文件缺失或版本不匹配`;
          console.error(err);
        }
      });
    }

    // ======================================
    // 3. 自动生成动画按钮
    // ======================================
    function createAnimButtons(anims) {
      anims.forEach(anim => {
        const btn = document.createElement('button');
        btn.textContent = anim.name;
        btn.onclick = () => player.setAnimation(anim.name, true);
        animList.appendChild(btn);
      });
    }

    // ======================================
    // 4. 控制按钮
    // ======================================
    function pauseAnim() { if (player) player.paused = true; }
    function resumeAnim() { if (player) player.paused = false; }

    // ======================================
    // 5. 渲染文件列表
    // ======================================
    function renderFileList() {
      fileList.innerHTML = '';
      spineFiles.forEach(file => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.textContent = file;
        div.onclick = () => {
          document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
          div.classList.add('active');
          loadSpine(file);
        };
        fileList.appendChild(div);
      });

      if (spineFiles.length === 0) {
        status.textContent = '⚠️ 未找到任何 .json 或 .skel 文件';
      } else {
        status.textContent = `✅ 找到 ${spineFiles.length} 个 Spine 文件`;
      }
    }

    // ======================================
    // 启动
    // ======================================
    window.addEventListener('load', async () => {
      await scanAllFiles();
      renderFileList();
    });
  </script>
</body>
</html>
