<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2/dist/spine-player.min.css">
<script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.min.js"></script>
<style>
body{margin:0;padding:0;background:#111;color:#fff;font-family:system-ui}
#app{display:flex;height:100vh}
#list{width:320px;background:#1a1a1a;border-right:1px solid #333;overflow-y:auto;padding:10px}
#player{flex:1}
.item{padding:10px 12px;margin:4px 0;border-radius:6px;cursor:pointer}
.item:hover{background:#2a2a2a}
.item.active{background:#0d47a1;color:white}
.path{font-size:12px;color:#888;margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <div id="list"></div>
  <div id="player"></div>
</div>

<script>
// ====================== 只改这里 3 个 ======================
const CONFIG = {
  USER: "sou2670519569-ship-it",
  REPO: "spine-",
  BRANCH: "main",
};
// ==========================================================

const BASE = `https://cdn.jsdelivr.net/gh/${CONFIG.USER}/${CONFIG.REPO}@${CONFIG.BRANCH}`;
const API = `https://api.github.com/repos/${CONFIG.USER}/${CONFIG.REPO}/git/trees/${CONFIG.BRANCH}?recursive=1`;

let player = null;
let list = document.getElementById("list");

async function load() {
  let res = await fetch(API);
  let data = await res.json();
  let files = data.tree.filter(f =>
    f.path.toLowerCase().endsWith(".json") ||
    f.path.toLowerCase().endsWith(".skel") ||
    f.path.toLowerCase().endsWith(".spine")
  );

  files.forEach(file => {
    let el = document.createElement("div");
    el.className = "item";
    let name = file.path.split("/").pop();
    let dir = file.path.substring(0, file.path.lastIndexOf("/")) || "root";
    el.innerHTML = `${name}<div class="path">${dir}</div>`;
    el.onclick = () => play(file.path);
    list.appendChild(el);
  });
}

async function play(path) {
  let base = path.substring(0, path.lastIndexOf("."));
  let skel = `${BASE}/${path}`;
  let atlas = `${BASE}/${base}.atlas`;

  if (player) player.dispose();
  document.querySelectorAll(".item").forEach(i => i.classList.remove("active"));
  event.currentTarget.classList.add("active");

  player = new spine.SpinePlayer("player", {
    jsonUrl: path.endsWith(".json") ? skel : undefined,
    skelUrl: path.endsWith(".skel") || path.endsWith(".spine") ? skel : undefined,
    atlasUrl: atlas,
    showControls: true,
    backgroundColor: "#000",
    premultipliedAlpha: true,
  });
}

load();
</script>
</body>
</html>
