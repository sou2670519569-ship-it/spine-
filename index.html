<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine 动画浏览器（GitHub Pages）</title>
<!-- 官方 Spine Player CSS -->
<link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.1.*/dist/spine-player.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{display:flex;height:100vh;}
#sidebar{width:260px;background:#f5f5f5;overflow:auto;padding:10px;border-right:1px solid #ccc;}
#player{flex:1;position:relative;}
.folder{font-weight:bold;margin:8px 0 4px 0;color:#222;}
.file{padding:4px 8px;margin:2px 0;background:#e9e9e9;border-radius:4px;cursor:pointer;}
.file:hover{background:#d0d0d0;}
</style>
</head>
<body>
<div id="sidebar"></div>
<div id="player"></div>

<!-- 官方 Spine Player JS -->
<script src="https://unpkg.com/@esotericsoftware/spine-player@4.1.*/dist/iife/spine-player.min.js"></script>
<script>
const ROOT = 'assets/'; // 资源根目录
let player = null;

// 初始化：获取仓库目录结构（利用 GitHub API 递归遍历）
async function init(){
  const sidebar = document.getElementById('sidebar');
  try{
    // 替换为你的：用户名、仓库名、分支（通常 main）
    const user = 'sou2670519569-ship-it';
    const repo = 'spine-';
    const branch = 'main';
    const apiUrl = `https://api.github.com/repos/${user}/${repo}/git/trees/${branch}?recursive=1`;
    const res = await fetch(apiUrl);
    const data = await res.json();
    const files = data.tree.filter(item=>item.path.startsWith(ROOT) && !item.type.includes('tree'));

    // 整理：按目录分组，筛选出有 .json/.skel + .atlas + .png 的动画
    const dirMap = {};
    files.forEach(item=>{
      const dir = item.path.substring(0, item.path.lastIndexOf('/'));
      if(!dirMap[dir]) dirMap[dir] = [];
      dirMap[dir].push(item.path);
    });

    // 渲染侧边栏
    for(const dir in dirMap){
      const dirFiles = dirMap[dir];
      const baseNames = new Set();
      dirFiles.forEach(p=>{
        const m = p.match(/([^/]+)\.(json|skel|atlas|png)$/);
        if(m) baseNames.add(m[1]);
      });
      // 检查是否成套
      baseNames.forEach(name=>{
        const hasJson = dirFiles.some(p=>p.endsWith(`${name}.json`));
        const hasSkel = dirFiles.some(p=>p.endsWith(`${name}.skel`));
        const hasAtlas = dirFiles.some(p=>p.endsWith(`${name}.atlas`));
        const hasPng = dirFiles.some(p=>p.endsWith(`${name}.png`));
        if((hasJson || hasSkel) && hasAtlas && hasPng){
          // 显示目录
          if(!document.querySelector(`[data-dir="${dir}"]`)){
            const folder = document.createElement('div');
            folder.className = 'folder';
            folder.textContent = dir.replace(ROOT, '');
            folder.dataset.dir = dir;
            sidebar.appendChild(folder);
          }
          // 显示动画项
          const item = document.createElement('div');
          item.className = 'file';
          item.textContent = name;
          item.dataset.dir = dir;
          item.dataset.name = name;
          item.addEventListener('click', ()=>loadAnimation(dir, name, hasSkel));
          sidebar.appendChild(item);
        }
      });
    }
  }catch(e){
    sidebar.innerHTML = '<div style="color:red">加载失败：' + e.message + '</div>';
    console.error(e);
  }
}

// 加载动画
function loadAnimation(dir, name, useSkel){
  const base = `${dir}/${name}`;
  const skeletonUrl = useSkel ? `${base}.skel` : `${base}.json`;
  const atlasUrl = `${base}.atlas`;

  // 销毁旧播放器
  if(player) player.dispose();

  // 创建新播放器
  player = new spine.SpinePlayer('player', {
    skeleton: skeletonUrl,
    atlas: atlasUrl,
    alpha: true,
    scale: 1,
    showControls: true,
    premultipliedAlpha: false
  });
}

// 启动
init();
</script>
</body>
</html>
